<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>My Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="date" id="today-date"></p>
        <h1 id="greeting">Hello</h1>
      </div>
      <p class="summary" id="summary"></p>
    </header>

    <div class="grid">
      <!-- TODAY -->
      <section class="card card-today" data-list="today" aria-labelledby="today-title">
        <div class="card-head">
          <div>
            <h2 id="today-title">Today</h2>
            <p class="card-sub" id="today-count"></p>
          </div>
          <div class="progress" aria-label="Today's progress">
            <svg viewBox="0 0 44 44" aria-hidden="true">
              <circle class="progress-track" cx="22" cy="22" r="18"></circle>
              <circle class="progress-bar" id="progress-bar" cx="22" cy="22" r="18"></circle>
            </svg>
            <span class="progress-text" id="progress-text">0%</span>
          </div>
        </div>
        <ul class="tasks"></ul>
        <form class="add-form">
          <input type="text" name="text" placeholder="Add a task for today…" autocomplete="off" maxlength="200" aria-label="New task for today">
          <button type="submit" aria-label="Add task">+</button>
        </form>
      </section>

      <!-- THIS WEEK -->
      <section class="card" data-list="week" aria-labelledby="week-title">
        <div class="card-head">
          <div>
            <h2 id="week-title">This Week</h2>
            <p class="card-sub" id="week-count"></p>
          </div>
        </div>
        <ul class="tasks"></ul>
        <form class="add-form">
          <input type="text" name="text" placeholder="Add a task for this week…" autocomplete="off" maxlength="200" aria-label="New task for this week">
          <button type="submit" aria-label="Add task">+</button>
        </form>
      </section>

      <!-- GOALS -->
      <section class="card" data-list="goals" aria-labelledby="goals-title">
        <div class="card-head">
          <div>
            <h2 id="goals-title">Goals</h2>
            <p class="card-sub" id="goals-count"></p>
          </div>
        </div>
        <ul class="tasks"></ul>
        <form class="add-form">
          <input type="text" name="text" placeholder="Add a goal…" autocomplete="off" maxlength="200" aria-label="New goal">
          <button type="submit" aria-label="Add goal">+</button>
        </form>
      </section>
    </div>

    <footer class="app-footer">
      <p>Your tasks are saved in this browser.</p>
      <button type="button" class="link-button" id="reset-button">Reset to sample tasks</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
